name: Firestore Notes backup to private Koofr

on:
  schedule:
    - cron: '30 20 * * *' # 03:30 Asia/Ho_Chi_Minh
  workflow_dispatch:
    inputs:
      confirm:
        description: Type BACKUP_FIRESTORE to run a verified backup now
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firestore-notes-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.event_name == 'schedule' || inputs.confirm == 'BACKUP_FIRESTORE'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Authenticate with main-only Google WIF
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: projects/989224849517/locations/global/workloadIdentityPools/notes-firestore-backup-gha/providers/github-main-backup
          service_account: notes-firestore-backup-gha@notes-lab-56f0f.iam.gserviceaccount.com
          project_id: notes-lab-56f0f
          create_credentials_file: true
          cleanup_credentials: true
      - name: Capture, upload, download, verify and apply bounded retention
        env:
          GOOGLE_CLOUD_PROJECT: notes-lab-56f0f
          NOTES_BACKUP_VAULT_ID: notes-production
          NOTES_BACKUP_KOOFR_CREDENTIAL: ${{ secrets.NOTES_BACKUP_KOOFR_CREDENTIAL }}
        run: |
          set -o pipefail
          node scripts/firestore-backup-action.mjs | tee -a "$GITHUB_STEP_SUMMARY"
