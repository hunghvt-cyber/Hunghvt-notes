name: Remove exact retired Notes test folders
on:
  push:
    branches: [release/minimal-notes]
permissions:
  contents: read
jobs:
  cleanup:
    if: contains(github.event.head_commit.message, '[notes-cleanup-39]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: notes-exact-test-root-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Delete only the exact reviewed 39 synthetic roots; never purge trash
        env:
          NOTES_MAINTENANCE: DELETE_EXACT_39_TEST_ROOTS_20261018
          KOOFR_WEBDAV_USER: ${{ secrets.KOOFR_WEBDAV_USER }}
          KOOFR_WEBDAV_APP_PASSWORD: ${{ secrets.KOOFR_WEBDAV_APP_PASSWORD }}
        run: node scripts/cleanup-test-folders.mjs
