name: Notes branch preview qualification
on:
  push:
    branches: [split/notes-standalone]
permissions:
  contents: read
jobs:
  live:
    if: contains(github.event.head_commit.message, '[notes-live]')
    strategy:
      fail-fast: false
      matrix:
        suite: [qualification, reliability]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: notes-branch-live-${{ matrix.suite }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Run synthetic suite against pinned Notes previews
        env:
          SUITE: ${{ matrix.suite }}
          KOOFR_WEBDAV_PROBE: ISOLATED_SYNTHETIC_ONLY
          KOOFR_WEBDAV_USER: ${{ secrets.KOOFR_WEBDAV_USER }}
          KOOFR_WEBDAV_APP_PASSWORD: ${{ secrets.KOOFR_WEBDAV_APP_PASSWORD }}
          NOTES_PREVIEW_URL: https://homepage-koofr-onqc1wm40-hunghvt.vercel.app
          NOTES_SECOND_PREVIEW_URL: https://homepage-koofr-pcve5j9sq-hunghvt.vercel.app
          NOTES_DEPLOYED_SHA: 4bfb12896b2390058d15cbc0105775cb1754f78c
        run: |
          case "$SUITE" in
            qualification) node scripts/koofr_preview_qualification.mjs ;;
            reliability) node scripts/koofr_store_reliability.mjs ;;
            *) exit 1 ;;
          esac
      - name: Produce public evidence summary
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: node scripts/summarize-live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: notes-${{ matrix.suite }}-summary
          path: notes-live-summary.json
          if-no-files-found: error
          retention-days: 14
