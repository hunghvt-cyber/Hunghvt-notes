name: Capture and verify Notes legacy baseline

on:
  push:
    branches: [main]
    paths:
      - .notes-migration/baseline-request.json

permissions:
  contents: read

concurrency:
  group: notes-legacy-baseline
  cancel-in-progress: false

jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[notes-legacy-baseline]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout canonical main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Decode only required GitHub OIDC claims locally
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          endpoint.searchParams.set('audience', 'https://hunghvt-notes.vercel.app/notes-legacy-baseline');
          const response = await fetch(endpoint, { headers: { authorization: 'Bearer ' + process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }, redirect: 'error' });
          if (!response.ok) throw new Error('OIDC_TOKEN_REQUEST_FAILED');
          const body = await response.json();
          const parts = body.value.split('.');
          if (parts.length !== 3) throw new Error('OIDC_TOKEN_FORMAT_INVALID');
          const claims = JSON.parse(Buffer.from(parts[1], 'base64url').toString('utf8'));
          const selected = Object.fromEntries(['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner_id', 'ref', 'workflow_ref', 'event_name'].map(key => [key, claims[key] ?? null]));
          process.stdout.write(JSON.stringify(selected) + '\\n');
          NODE
      - name: Authenticate with read-only main WIF
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: projects/989224849517/locations/global/workloadIdentityPools/notes-firestore-backup-gha/providers/github-main-backup
          service_account: notes-firestore-backup-gha@notes-lab-56f0f.iam.gserviceaccount.com
          project_id: notes-lab-56f0f
          create_credentials_file: true
          cleanup_credentials: true
      - name: Validate requested immutable or primary export URL
        id: request
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFile} from 'node:fs/promises';
          const request=JSON.parse(await readFile('.notes-migration/baseline-request.json','utf8'));
          const url=new URL(request.exportUrl);
          const allowed=url.hostname==='hunghvt-notes.vercel.app'||/^hunghvt-notes-[a-z0-9-]+-hunghvt\.vercel\.app$/.test(url.hostname);
          if(url.protocol!=='https:'||!allowed||url.pathname!=='/api/migration-export'||url.search)process.exit(1);
          process.stdout.write('url='+url.href+'\n');
          NODE
      - name: Capture both sources, compare and archive outside NAS
        env:
          GOOGLE_CLOUD_PROJECT: notes-lab-56f0f
          NOTES_BACKUP_VAULT_ID: notes-production
          NOTES_EXPORT_URL: ${{ steps.request.outputs.url }}
          NOTES_BACKUP_KOOFR_CREDENTIAL: ${{ secrets.NOTES_BACKUP_KOOFR_CREDENTIAL }}
        run: node scripts/notes-legacy-baseline.mjs
