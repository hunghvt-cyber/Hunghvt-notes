name: Notes synthetic live qualification
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [qualification, reliability]
        required: true
      confirm:
        description: 'Type SYNTHETIC_ONLY; no real Notes or backup paths'
        type: string
        required: true
permissions:
  contents: read
jobs:
  live:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'SYNTHETIC_ONLY' && vars.NOTES_LIVE_ENABLED == 'synthetic-only-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: notes-synthetic-live
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Run selected synthetic suite
        env:
          SUITE: ${{ inputs.suite }}
          KOOFR_WEBDAV_PROBE: ISOLATED_SYNTHETIC_ONLY
          KOOFR_WEBDAV_USER: ${{ secrets.KOOFR_WEBDAV_USER }}
          KOOFR_WEBDAV_APP_PASSWORD: ${{ secrets.KOOFR_WEBDAV_APP_PASSWORD }}
          NOTES_PREVIEW_URL: ${{ vars.NOTES_PREVIEW_URL }}
          NOTES_SECOND_PREVIEW_URL: ${{ vars.NOTES_SECOND_PREVIEW_URL }}
          NOTES_DEPLOYED_SHA: ${{ vars.NOTES_DEPLOYED_SHA }}
        run: |
          case "$SUITE" in
            qualification) node scripts/koofr_preview_qualification.mjs ;;
            reliability) node scripts/koofr_store_reliability.mjs ;;
            *) exit 1 ;;
          esac
      # Do not upload raw provider responses, fixture tokens or account configs.
